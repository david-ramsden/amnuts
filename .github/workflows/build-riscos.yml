---
# RISC OS CI build through build.riscos.online
#
# To reuse this configuration with your own repository:
#
#   - Create a .robuild.yaml to describe what should be built on RISC OS.
#       - `jobs.build.script` should be a list of commands to run on RISC OS
#       - `jobs.build.artifacts.path` should be the directory to zip.
#   - Create a VersionNum file if you wish to use the automated versioning
#     in the same style as the RISC OS sources. [optional]
#   - Update the 3rd step ('give the archive a versioned name') to give a
#     suitable name for the archive.
#   - Update the 4th step ('upload-artifacts') to include the same names.
#
# The 'release' job is triggered when a tag starting with a 'v' is created,
# which will create a GitHub release for the repository with the name of the
# version tag. The release will be a draft, and should be updated with
# changes as you see fit.
#

name: RISC OS

# Controls when the action will run. Triggers the workflow on:
#   * push on any branch.
#   * tag creation for tags beginning with a 'v'
#   * pull requests
on:
  push:
    branches: ["*"]
    tags: ["v*"]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: ["*"]

env:
  COMPONENT_NAME: "amnuts"

jobs:
  build-riscos:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: riscos-build-server
    outputs:
      version: ${{ steps.version.outputs.version }}
      leafname: ${{ steps.version.outputs.leafname }}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6

      - name: Obtain prerequisite build tool
        run: |
          curl -s -L -o ${{ runner.temp }}/riscos-build-online https://github.com/gerph/robuild-client/releases/download/v0.07/riscos-build-online && chmod +x ${{ runner.temp }}/riscos-build-online

      - name: Build through build.riscos.online
        id: ro-build
        run: |
          echo "Zip up RISC OS source."
          (cd RISCOS && zip -q9r /tmp/source-archive.zip c h Makefile* .robuild.yaml)

          echo "Send RISC OS source to build service."
          ${{ runner.temp }}/riscos-build-online -i /tmp/source-archive.zip -a off -t 120 -o /tmp/built

      - name: Give the output a versioned name
        id: version
        run: |
          if [ -f VersionNum ] ; then
              version=$(sed '/MajorVersion / ! d ; s/.*MajorVersion *"\(.*\)"/\1/' VersionNum)
          else
              version=$(
                [ "$GITHUB_REF_TYPE" = "tag" ] &&
                echo "$GITHUB_REF_NAME" ||
                git rev-parse --short HEAD
              )
          fi
          echo "This is version: $version"
          leafname="$COMPONENT_NAME-$version.zip"
          if [ -f /tmp/built,a91 ] ; then
              cp /tmp/built,a91 "$leafname"
          else
              echo "No archive was built?"
              exit 1
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "leafname=$leafname" >> $GITHUB_OUTPUT

      - name: Build RISC OS distribution zip
        id: ro-dist-zip
        run: |
          echo "Install rozipinfo."
          python3 -m pip install rozipinfo

          dist=${{ runner.temp }}/dist
          mkdir -vp $dist

          echo "Create !Amnuts application with built binary."
          mv RISCOS/\!Amnuts $dist
          sed -i "s/%version%/${{ steps.version.outputs.version }}/g" $dist/\!Amnuts/\!Run,feb
          python3 -m rozipfile --chdir $dist/\!Amnuts --extract ${{ steps.version.outputs.leafname }} && rm ${{ steps.version.outputs.leafname }}

          echo "Add RISC OS source."
          mkdir src2 && cp -rL RISCOS/* src2/
          rm -rf src && mv src2 src

          echo "Remove unnecessary artifacts."
          rm -rf RISCOS Makefile

          echo "Add artifacts."
          mv * $dist/\!Amnuts

          echo "Zip artifact."
          (cd $dist && python3 -m rozipfile --create ${{ steps.version.outputs.leafname }} *)

          mv $dist/${{ steps.version.outputs.leafname }} . && ls -l ${{ steps.version.outputs.leafname }}

      - uses: actions/upload-artifact@v7
        with:
          name: RISCOS-build
          path: ${{ steps.version.outputs.leafname }}
        # The artifact that is downloadable from the Actions is actually a zip of the artifacts
        # that we supply. So it will be a regular Zip file containing a RISC OS Zip file.

  # The release only triggers when the thing that was pushed was a tag starting with 'v'
  release:
    needs: build-riscos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: RISCOS-build

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          prerelease: false
          draft: true
          artifacts: "${{ needs.build-riscos.outputs.leafname }}"
          artifactContentType: application/zip
